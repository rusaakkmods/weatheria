<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf1eb">
    <title>Weatheria</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main class="shell">
        <header class="brand" aria-label="Weatheria">
            <span class="brand-mark" aria-hidden="true">W</span>
            <span>Weatheria</span>
        </header>

        <section class="welcome" aria-labelledby="page-title">
            <p class="eyebrow">Weather, observed</p>
            <h1 id="page-title">Weatheria</h1>
            <div class="country-picker">
                <label for="country-select">Country</label>
                <select id="country-select" name="country" aria-describedby="country-status" disabled>
                    <option value="">Select a country</option>
                </select>
                <p class="status" id="country-status" role="status" aria-live="polite">Loading countries...</p>
            </div>
            <div class="city-picker">
                <label for="city-select">City</label>
                <select id="city-select" name="city" aria-describedby="city-status" disabled>
                    <option value="">Select a country first</option>
                </select>
                <p class="status" id="city-status" role="status" aria-live="polite">Select a country first.</p>
            </div>
        </section>

        <footer class="footer">Application shell</footer>
    </main>
</body>
</html>
