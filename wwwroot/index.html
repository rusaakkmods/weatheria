<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf1eb">
    <title>Weatheria</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main class="shell">
        <header class="brand" aria-label="Weatheria">
            <span class="brand-mark" aria-hidden="true">W</span>
            <span>Weatheria</span>
        </header>

        <section class="welcome" aria-labelledby="page-title">
            <p class="eyebrow">Weather, observed</p>
            <h1 id="page-title">Weatheria</h1>
            <div class="country-picker">
                <label for="country-select">Country</label>
                <select id="country-select" name="country" aria-describedby="country-status" disabled>
                    <option value="">Select a country</option>
                </select>
                <p class="status" id="country-status" role="status" aria-live="polite">Loading countries...</p>
            </div>
            <div class="city-picker">
                <label for="city-select">City</label>
                <select id="city-select" name="city" aria-describedby="city-status" disabled>
                    <option value="">Select a country first</option>
                </select>
                <p class="status" id="city-status" role="status" aria-live="polite">Select a country first.</p>
            </div>
        </section>

        <section class="weather-panel" id="weather-panel" aria-labelledby="weather-title" hidden>
            <div class="weather-heading">
                <div>
                    <p class="eyebrow">Current conditions</p>
                    <h2 id="weather-title">Weather</h2>
                </div>
                <p class="status" id="weather-status" role="status" aria-live="polite"></p>
            </div>
            <dl class="weather-grid" id="weather-metrics" hidden>
                <div class="weather-metric"><dt>Location</dt><dd id="weather-location"></dd></div>
                <div class="weather-metric"><dt>Time (UTC)</dt><dd><time id="weather-time"></time></dd></div>
                <div class="weather-metric"><dt>Temperature (°F)</dt><dd id="weather-temperature-f"></dd></div>
                <div class="weather-metric"><dt>Temperature (°C)</dt><dd id="weather-temperature-c"></dd></div>
                <div class="weather-metric"><dt>Dew Point (°F)</dt><dd id="weather-dew-point"></dd></div>
                <div class="weather-metric"><dt>Relative Humidity</dt><dd id="weather-humidity"></dd></div>
                <div class="weather-metric"><dt>Wind Speed</dt><dd id="weather-wind-speed"></dd></div>
                <div class="weather-metric"><dt>Wind Direction</dt><dd id="weather-wind-direction"></dd></div>
                <div class="weather-metric"><dt>Visibility</dt><dd id="weather-visibility"></dd></div>
                <div class="weather-metric"><dt>Pressure</dt><dd id="weather-pressure"></dd></div>
                <div class="weather-metric"><dt>Sky Condition</dt><dd id="weather-sky-condition"></dd></div>
            </dl>
            <form class="note-form" id="weather-note-form" hidden>
                <label for="weather-note">Weather note</label>
                <textarea id="weather-note" name="content" rows="3" maxlength="1000" required></textarea>
                <button id="save-note" type="submit" disabled>Save note</button>
                <p class="status" id="note-status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <footer class="footer">Application shell</footer>
    </main>
</body>
</html>
